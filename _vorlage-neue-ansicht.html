<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorlage · WeNurse HubSpot-Sandbox</title>
<link rel="stylesheet" href="../assets/hubspot.css">
<link rel="stylesheet" href="../assets/sandbox.css">
</head>
<body>

<div class="hs-app" id="hs-app"></div>

<script>
/* ============================================================================
   VORLAGE FÜR EINE NEUE ANSICHT
   ----------------------------------------------------------------------------
   1. Diese Datei kopieren  →  views/meine-neue-ansicht.html
   2. Unten "datei", "titel" und die Inhalte anpassen.
   3. Datei im Browser öffnen (Doppelklick). Fertig.
   Im Anhang dieser Datei stehen alle Kartentypen als Beispiel (Abschnitt B).
   ============================================================================ */
window.SANDBOX_VIEW = {

  /* --- Kennung (ohne .html), bestimmt den Dateinamen beim Abnahme-Export --- */
  datei: 'meine-neue-ansicht',
  titel: 'Meine neue Ansicht',
  untertitel: 'Kurze Beschreibung · z. B. «Vorschlag Gruppierung Einsatz-Kern»',
  objekt: 'Deal',                 /* Kontakt | Unternehmen | Deal – nur zur Info */
  navAktiv: '',                   /* '' = kein Navigationspunkt aktiv */
  zurueck: 'Deals',               /* Text des Zurück-Links oben links */

  /* ------------------------------------------------ A1. Record-Kopf (links) */
  identitaet: {
    name: 'Name des Datensatzes',
    unter: 'Unterzeile · z. B. Verleih · Langzeitpflege',
    avatar: { icon: 'deal' },     /* person | firma | deal  oder: initialen: 'AB' */
    badges: [
      { text: 'Pipeline: Institution', farbe: 'teal' },
      { text: 'Stage', farbe: 'gruen' }
    ]
  },
  aktionen: ['Note', 'Email', 'Call', 'Task', 'Meeting', 'More'],

  /* ---------------------------------------- A2. Abschnitte der linken Spalte */
  links: {
    karten: [
      {
        typ: 'abschnitt',
        titel: 'Abschnittsüberschrift',
        sbId: 'abschnitt-1',                         /* Anker für Änderungs-Marker */
        spalten: 1,                                  /* 1 = untereinander (Standard in der linken Spalte, wie HubSpot) · 2 | 3 | 4 */
        felder: [
          { label: 'Feld A', wert: 'Verleih', art: 'token' },        /* Chip mit × */
          { label: 'Feld B', wert: '22.09.2026' },                   /* normaler Text */
          { label: 'Feld C', wert: '100 %', art: 'meter', prozent: 100 },
          { label: 'Feld D', wert: 'Nadine Muster', art: 'person' },
          { label: 'Feld E', wert: 'Dipl. Pflegefachfrau HF', art: 'lang', breit: true },
          { label: 'Feld F', wert: '', sbId: 'feld-f' }              /* leer = "–" */
        ]
      }
    ]
  },

  /* -------------------------------------- B. Karten der Mittel- und Rechtsspalte */
  mitte: {
    tabs: ['Catch-up', 'Overview', 'Activities', 'Intelligence'],
    aktivTab: 'Overview',
    karten: [
      { typ: 'leer', titel: 'Pinned activity', text: 'There is no pinned activity on this record.' }
    ]
  },

  rechts: {
    titel: 'Record summary',
    badge: '',
    karten: []
  },

  /* ------------------------------------------------- C. Änderungsvorschläge -- */
  aenderungen: [
    {
      nr: 1,
      titel: 'Was soll geändert werden?',
      ziel: 'abschnitt-1',
      text: 'Kurz begründen, warum – dann fällt dem Backoffice die Rückmeldung leichter.'
    }
  ]
};

/* ============================================================================
   ANHANG · Kopiervorlagen für alle Kartentypen
   ----------------------------------------------------------------------------
   Einfach in "mitte.karten" bzw. "rechts.karten" einfügen.

   { typ: 'felder', titel: 'Überschrift', spalten: 4, sbId: 'x',
     felder: [ { label: 'A', wert: 'B' } ] }

   { typ: 'text', titel: 'Überschrift', text: 'Ein Absatz Fliesstext.' }

   { typ: 'leer', titel: 'Pinned activity',
     text: 'There is no pinned activity on this record.' }

   { typ: 'progression', titel: 'Deal progression tracker',
     start: { label: 'Startdatum Deal', wert: '22.09.2026' },
     ende:  { label: 'Enddatum Deal',  wert: '30.11.2026' },
     fuellung: 8, werte: [] }

   { typ: 'tracker', titel: 'Deal stage tracker',
     stage: 'Unterschritten – nicht gestartet', stageFarbe: 'gruen', dauer: '4 Tage',
     segmente: [ { zustand: 'voll', check: true }, { zustand: 'halb' }, {}, {} ],
     spalten: 4, felder: [ { label: 'Startdatum Deal', wert: '22.09.2026' } ] }

   { typ: 'gruppe', titel: 'Gruppenüberschrift', karten: [ ...Karten wie oben... ] }

   { typ: 'feed', gruppen: [
       { titel: 'Upcoming', eintraege: [
           { typ: 'aufgabe', kopf: [ { t: 'Task' }, { t: 'Rita Beispiel', stark: true } ],
             zeit: 'Fällig 24. Sep. 2026 08:00', aufgabe: 'Feedback einholen?' },
           { typ: 'email', kopf: [ { t: 'Email' }, { t: 'Betreff', stark: true } ],
             zeit: '21. Sep. 2026 14:52', statusPunkt: 'gruen',
             koerper: ['Erster Absatz', 'Zweiter Absatz'],
             fuss: [ { punkt: 'gruen', label: 'Opens', wert: '1' } ] },
           { typ: 'notiz', kopf: [ { t: 'Note by' }, { t: 'Name', stark: true } ],
             zeit: '22. Sep. 2023 15:44', koerper: ['Notiztext …'],
             klasse: 'hs-activity--pinned' }   // gelb hervorgehoben
       ] } ] }

   { typ: 'liste', titel: 'Contacts', anzahl: 1, suchen: true, add: true,
     leerText: 'Keine Einträge',
     eintraege: [ { icon: 'person', initialen: 'BB', titel: 'Name',
                    zeilen: [ ['Email:', 'a@b.ch'], ['Job title:', 'Leitung Pflege'] ],
                    labels: ['Deal Kontakt'],
                    dealKarte: { stage: 'Archiv',
                                 zeilen: [ ['Close Date:', '15. Februar 2024'] ],
                                 fuss: 'Deal with Primary Company' } } ],
     alleLink: 'View all associated Contacts' }

   { typ: 'score', titel: 'Lead Score', badge: 'CH Lead Score Simple',
     wert: 100, delta: '100 points',
     zeilen: [ { label: 'Engagement score', wert: '23' } ], link: 'View details' }

   { typ: 'leadStager', titel: 'Lead stager tracker', tag: 'Primary',
     fuellung: 18, leisteText: '1 von 6 Stufen',
     felder: [ { label: 'Owner', wert: 'Name', art: 'person' } ] }

   { typ: 'anhaenge', titel: 'Attachments' }

   { typ: 'html', html: '<div style="padding:12px">Freies HTML</div>' }

   Werte-Arten (art):  token | tokens | pill | pillhell | person | link |
                       meter | datum | lang   ·  ohne Angabe = Text
   Farben (farbe):     teal | gruen | blau | grau | gelb | orange | hell
   ============================================================================ */
</script>

<script src="../assets/hubspot.js"></script>
<script src="../data/segmente.js"></script>
<script src="../assets/sandbox.js"></script>
</body>
</html>
